# Lean formalization of the distance-product volume and inradius bounds.
name = "ErdosVolumeLean"
version = "0.1.0"
defaultTargets = ["ErdosVolume"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "ErdosVolume"
globs = ["ErdosVolume", "ErdosVolume.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Challenge"
globs = ["Challenge", "Challenge.+"]
weakLeanArgs = ["-j1"]
