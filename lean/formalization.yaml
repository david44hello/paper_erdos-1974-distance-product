version: v0.4
project:
  name: Sharp volume and inradius bounds for distance-product solids
  description: For finitely many Euclidean marks with positive weights summing to one in dimension d ≥
    3, the sublevel set of their weighted geometric mean of distances at threshold R > 0 has volume at
    most that of the radius-R ball, with equality exactly for coincident marks. The capacity proof takes
    six named analytic hypotheses and the flux proof takes eight. In three dimensions, seven named hypotheses
    give a sharp first-order inradius bound as the volume deficit tends to zero. Equally weighted approaching
    marks prove unconditionally that every coefficient smaller than one fails.
  authors:
  - Dave Goel
  license: Apache-2.0
  responsible_maintainers:
  - Dave Goel
