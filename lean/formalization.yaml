status:
  scope: The two volume routes concern dimensions d ≥ 3. The capacity route assumes open isocapacity,
    capacity normalization, ball capacity, equilibrium existence, the equilibrium log-moment bound and
    its sphere equality implication. The flux route assumes sharp isoperimetry, finite level area, punctured
    and ball Gauss identities, sphere area, scalar Sard, an analytic null-set result and coarea on slabs.
    The three-dimensional stability bound assumes OpenIsoFact, CapacityNormalization, BallCapacityFact,
    EquilibriumExistence, Frostman, EqUnique and BallLaw. The separate lower witness uses no analytic
    input. The five unconditional forms ErdosVolume.Paper.finite_volume, ErdosVolume.Paper.erdos_product,
    ErdosVolume.Paper.first_order_radius, ErdosVolume.uniform_upper and ErdosVolume.sharp_stability remain
    open in this development.
