fidelity:
  divergences: The arbitrary-mark volume comparison begins in dimension three. The planar result in the
    paper title is separately attributed to Pólya. Two direct proof placeholders in the wider development
    affect the five unconditional forms listed in scope. The selected conditional proofs and lower witness
    use none of those placeholders.
